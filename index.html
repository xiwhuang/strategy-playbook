<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4ede0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="A bilingual, interactive playbook of portfolio strategies — an educational visualization, not investment advice."
    />

    <!-- Link previews, for sharing the page to a phone or a chat -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Strategy Playbook · 策略手册" />
    <meta
      property="og:description"
      content="Interactive, bilingual portfolio allocation and cash-flow waterfall. Educational illustration only."
    />
    <meta name="twitter:card" content="summary" />

    <title>Strategy Playbook · 策略手册</title>

    <!-- A pencil-drawn favicon, inline so the page stays dependency-free -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='10' fill='%23f4ede0'/%3E%3Cg fill='none' stroke='%23111827' stroke-width='3' stroke-linecap='round'%3E%3Cpath d='M9 33 C 15 18, 23 29, 29 16'/%3E%3Ccircle cx='29' cy='16' r='3'/%3E%3C/g%3E%3Cpath d='M7 40 C 19 37, 32 43, 42 38' fill='none' stroke='%231dad97' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E"
    />

    <!-- Display face: xkcd Script, self-hosted (see fonts/README.md).
         Body + figures come from Google Fonts. The page stays readable with the
         local fallbacks in styles.css if either never loads. -->
    <link rel="preload" href="./fonts/xkcd-script.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Nunito:wght@400;600;700&display=swap"
    />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
